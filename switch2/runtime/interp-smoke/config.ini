; mono-nx's config, as sdmc:/mono/config.ini, for the PKForge Mono smoke test.
[mono]
logging = true
icu = /mono/etc/icudt77l.dat
assembly_dir = "/mono/lib_net9.0;/mono/framework_net9.0"
config_dir = /mono/etc
default_assembly = /switch/PKForge/mono-smoke/example.dll

[nx]
; Output goes to a log file, which is read back over the console's FTP server.
file_io_redirect = /switch/PKForge/logs/mono-example.txt
exit_process_on_end = true
