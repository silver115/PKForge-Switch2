; mono-nx's config for the PKForge host, read from romfs:/aot_config.ini in both modes. build.sh sets
; default_assembly to the project it builds.
; The host changes directory to romfs:/ first, so "/" here is the romfs root (Mono does not take "romfs:" paths).
; There is no icu line: globalization is invariant and no ICU data ships (the vendored core.c skips ICU then).
[mono]
; mono-nx's own messages, such as how each P/Invoke library resolved
logging = true
assembly_dir = /
config_dir = /
default_assembly = /PKForge.Switch2.Spike.dll

[nx]
; stdout, stderr and mono-nx's messages; unhandled managed exceptions land here too
file_io_redirect = sdmc:/switch/PKForge/logs/mono.txt
exit_process_on_end = true
